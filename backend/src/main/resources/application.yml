server:
  port: ${PORT:8082}

spring:
  application:
    name: banking-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./backend/data/banking;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_UPPER=false}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

banking:
  credit-service-url: ${CREDIT_SERVICE_URL:http://localhost:8084/api/credit/check}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.banking: INFO
