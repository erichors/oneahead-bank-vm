server:
  port: ${PORT:8082}

spring:
  application:
    name: banking-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/oneahead}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:oneahead}
    password: ${SPRING_DATASOURCE_PASSWORD:oneahead}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

banking:
  credit-service-url: ${CREDIT_SERVICE_URL:http://localhost:8084/api/credit/check}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.banking: INFO
